# CI + security baseline (DevSecOps Phase 1). Public repository: GitHub-hosted runners.
# Railway deploys awesome-web and awesome-api from main only after these checks pass
# ("Wait for CI" on both services).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  awesome-web:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/ci-node.yml@7701f772ce4baa97c5c2cd876dd19a37f33ffcc3 # v1.0.0
    with:
      working-directory: apps/awesome-web
      node-version: "22"
      build-command: npm run build

  awesome-api:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/ci-python.yml@7701f772ce4baa97c5c2cd876dd19a37f33ffcc3 # v1.0.0
    with:
      working-directory: services/awesome-api
      python-version: "3.12" # matches the python:3.12-slim runtime image

  security:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/security.yml@7701f772ce4baa97c5c2cd876dd19a37f33ffcc3 # v1.0.0
